# Publishes the web app to a Hugging Face Space (Docker) on every push to main.
#
# One-time setup (see docs/DEPLOY.md):
#   1. Create a Hugging Face access token with "Write" permission.
#   2. In this GitHub repo: Settings -> Secrets and variables -> Actions ->
#      New repository secret, name HF_TOKEN, value = the token.
#   3. Optional: a repository variable HF_SPACE (e.g. yourname/groundwater-recharge-bhopal).
#      Without it the Space is <your HF username>/groundwater-recharge-bhopal.
# The Space is created on the first run if it does not exist.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "data/**"
      - "Dockerfile"
      - "requirements-app.txt"
      - "deploy/**"
      - ".github/workflows/deploy-space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the Space files
        run: |
          mkdir -p _space/data/raw _space/data/outputs
          cp -r backend frontend Dockerfile requirements-app.txt .dockerignore _space/
          cp deploy/space_README.md _space/README.md
          cp -r data/processed _space/data/
          cp -r data/raw/boundaries _space/data/raw/
          cp data/outputs/validation_* _space/data/outputs/ 2>/dev/null || true
          find _space -name "__pycache__" -prune -exec rm -rf {} +
          du -sh _space

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set (see docs/DEPLOY.md)"; exit 1
          fi
          pip install --quiet "huggingface_hub>=0.30"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ.get("HF_SPACE") or f"{api.whoami()['name']}/groundwater-recharge-bhopal"
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space, repo_type="space", folder_path="_space",
              commit_message=f"Deploy {os.environ.get('GITHUB_SHA', '')[:7]}",
              delete_patterns=["backend/**", "frontend/**", "data/**"],
          )
          owner, name = space.split("/")
          url = f"https://{owner}-{name}".lower().replace("_", "-").replace(".", "-") + ".hf.space"
          print(f"Space: https://huggingface.co/spaces/{space}")
          print(f"App:   {url}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"Deployed to https://huggingface.co/spaces/{space}\n\nApp URL: {url}\n")
          PY
